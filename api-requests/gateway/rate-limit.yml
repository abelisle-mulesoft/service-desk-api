info:
  name: Rate Limiting
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/incidents/{{openIncidentId}}"
  headers:
    - name: client_id
      value: "{{clientId}}"
    - name: client_secret
      value: "{{clientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () { expect(res.getStatus()).to.equal(200); });
        test("Incident ID matches", function () { expect(res.getBody().id).to.eql(bru.getCollectionVar("openIncidentId")); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
