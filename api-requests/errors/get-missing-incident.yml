info:
  name: Get missing incident
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/incidents/INC-9999"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 404", function () { expect(res.getStatus()).to.equal(404); });
        test("Problem title", function () { expect(res.getBody().title).to.eql("Incident Not Found"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Expected: 404 Incident Not Found."
