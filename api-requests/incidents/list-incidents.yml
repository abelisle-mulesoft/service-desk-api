info:
  name: List incidents
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/incidents"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () { expect(res.getStatus()).to.equal(200); });
        test("Response is an array", function () { expect(res.getBody()).to.be.an("array"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
