info:
  name: Assign incident
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/incidents/{{createdIncidentId}}/assign"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "assignedTo": "Network Support"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () { expect(res.getStatus()).to.equal(200); });
        test("Assignment updated", function () { expect(res.getBody().assignedTo).to.eql("Network Support"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Run Create incident first so `createdIncidentId` is populated.
